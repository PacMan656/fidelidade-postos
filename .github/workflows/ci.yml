name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # o emulador do Firestore precisa de Java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Tipos das Cloud Functions
        run: npm --prefix functions run typecheck

      - name: Testes unitários (regras de negócio)
        run: npm --prefix functions run test:unit

      - name: Testes nos emuladores (segurança e fluxos)
        run: npm run test:emulators

      - name: Build do app
        run: npm run build
